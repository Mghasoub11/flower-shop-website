<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flower Shop — Admin Panel</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Georgia, serif; background: #faf7f2; color: #2e2a26; margin: 0; }
  header { background: #6b4c57; color: #fff; padding: 20px; text-align: center; }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 20px; }
  #loginBox { max-width: 320px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #e6ddd3; }
  input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 10px 16px; background: #6b4c57; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; }
  th, td { border: 1px solid #e6ddd3; padding: 8px; text-align: left; font-size: 14px; }
  th { background: #f1e9e2; }
  .hidden { display: none; }
  .msg { padding: 8px; border-radius: 4px; margin-bottom: 10px; }
  .msg.ok { background: #e4f3e1; color: #2d6a1f; }
  .msg.err { background: #fbe4e4; color: #a12; }
  select { padding: 4px; }
  h2 { margin-top: 32px; }
  #logoutBtn { float: right; }
</style>
</head>
<body>

<header><h1>🌸 Flower Shop — Admin Panel</h1></header>

<div id="loginBox">
  <div id="loginMsg"></div>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Log in</button>
</div>

<div class="container hidden" id="dashboard">
  <button id="logoutBtn" onclick="logout()">Log out</button>
  <h2>Products</h2>
  <table id="productsTable">
    <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th></th></tr></thead>
    <tbody></tbody>
  </table>

  <h3>Add product</h3>
  <input type="text" id="pName" placeholder="Name">
  <input type="number" id="pPrice" placeholder="Price">
  <input type="text" id="pCategory" placeholder="Category">
  <input type="text" id="pDescription" placeholder="Description">
  <input type="number" id="pStock" placeholder="Stock">
  <button onclick="addProduct()">Add product</button>

  <h2>Orders</h2>
  <table id="ordersTable">
    <thead><tr><th>ID</th><th>Customer</th><th>Address</th><th>Total</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
  const API_BASE = ''; // same origin as this page when deployed together

  async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const res = await fetch(`${API_BASE}/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password })
    });
    if (res.ok) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadProducts();
      loadOrders();
    } else {
      document.getElementById('loginMsg').innerHTML = '<div class="msg err">Invalid credentials</div>';
    }
  }

  async function logout() {
    await fetch(`${API_BASE}/admin/logout`, { method: 'POST', credentials: 'include' });
    location.reload();
  }

  async function loadProducts() {
    const res = await fetch(`${API_BASE}/products`);
    const products = await res.json();
    const tbody = document.querySelector('#productsTable tbody');
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>${p.name}</td>
        <td>$${p.price}</td>
        <td>${p.stock}</td>
        <td>${p.category || ''}</td>
        <td><button onclick="deleteProduct(${p.id})">Delete</button></td>
      </tr>
    `).join('');
  }

  async function addProduct() {
    const body = {
      name: document.getElementById('pName').value,
      price: parseFloat(document.getElementById('pPrice').value),
      category: document.getElementById('pCategory').value,
      description: document.getElementById('pDescription').value,
      stock: parseInt(document.getElementById('pStock').value) || 0
    };
    const res = await fetch(`${API_BASE}/products`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    });
    if (res.ok) loadProducts();
  }

  async function deleteProduct(id) {
    await fetch(`${API_BASE}/products/${id}`, { method: 'DELETE', credentials: 'include' });
    loadProducts();
  }

  async function loadOrders() {
    const res = await fetch(`${API_BASE}/orders`, { credentials: 'include' });
    if (!res.ok) return;
    const orders = await res.json();
    const tbody = document.querySelector('#ordersTable tbody');
    tbody.innerHTML = orders.map(o => `
      <tr>
        <td>${o.id}</td>
        <td>${o.customer_name}</td>
        <td>${o.delivery_address}</td>
        <td>$${o.total}</td>
        <td>
          <select onchange="updateStatus(${o.id}, this.value)">
            <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>pending</option>
            <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>processing</option>
            <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>delivered</option>
          </select>
        </td>
      </tr>
    `).join('');
  }

  async function updateStatus(id, status) {
    await fetch(`${API_BASE}/orders/${id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ status })
    });
    loadOrders();
  }

  // check if already logged in (session cookie)
  fetch(`${API_BASE}/admin/check`, { credentials: 'include' })
    .then(r => r.json())
    .then(d => {
      if (d.isAdmin) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadProducts();
        loadOrders();
      }
    });
</script>

</body>
</html>
